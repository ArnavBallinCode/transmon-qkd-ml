name: IBM Quantum Time-Series Extraction

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write

jobs:
  extract-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qiskit-ibm-runtime pandas
          
      - name: Extract Calibration Data
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
        run: |
          python src/hardware/extract_calibration_data.py
          
      - name: Extract Readout Errors
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
        run: |
          python src/hardware/extract_readout_errors.py
          
      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hardware/ibm_marrakesh_calibration_timeseries.csv
          git add data/hardware/ibm_marrakesh_readout_timeseries.csv
          git commit -m "chore: append automated time-series calibration data" || echo "No changes to commit"
          git push
