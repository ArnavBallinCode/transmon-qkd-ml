name: Submit Hardware Benchmarks

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  
concurrency:
  group: hardware-data
  cancel-in-progress: false

jobs:
  submit-benchmarks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qiskit-ibm-runtime pandas numpy
          
      - name: Submit Benchmarks
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
        run: |
          python src/hardware/submit_benchmarks.py
          
      - name: Commit and Push Pending Jobs
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs/
          git commit -m "chore: submit new benchmark jobs" || echo "No changes to commit"
          git push
